<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>La Rimessa — You're on the list</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#030100">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="32x32" media="(prefers-color-scheme: light)" href="favicon-32-light.png">
<link rel="apple-touch-icon" href="favicon-256.png">
<link rel="stylesheet" href="https://use.typekit.net/zca8oaq.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;700&display=swap" rel="stylesheet">
<style>
  :root{
    --base:#030100;
    --primary:#D1CFD7;
    --bright:#E8E7EB;
    --ink:#030100;
    --muted:#8D8B90;
    --font:"itc-avant-garde-gothic-pro","Jost","Helvetica Neue",Arial,sans-serif;
  }
  *,*::before,*::after{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;background:var(--base);color:var(--primary);
    font-family:var(--font);font-weight:300;line-height:1.6;
    -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
    display:flex;align-items:center;justify-content:center;
    padding:2rem clamp(1.25rem,5vw,4rem);position:relative;overflow:hidden;
  }
  .glow{position:absolute;left:50%;top:42%;width:min(80vw,900px);height:50vh;
    transform:translate(-50%,-50%);pointer-events:none;
    background:radial-gradient(closest-side,rgba(209,207,215,.06),rgba(209,207,215,0) 70%);}
  .wrap{position:relative;z-index:1;width:100%;max-width:40rem;
    display:flex;flex-direction:column;align-items:center;text-align:center;gap:1.6rem;
    opacity:0;transform:translateY(16px);animation:rise 1s cubic-bezier(.2,.6,.2,1) .15s forwards;}
  .logo{width:min(340px,72vw);height:auto;margin-bottom:.8rem;}
  .eyebrow{font-weight:700;font-size:.72rem;letter-spacing:.26em;text-transform:uppercase;color:var(--muted);}
  h1{margin:0;font-family:var(--font);font-weight:700;
    font-size:clamp(1.9rem,5.5vw,3.1rem);line-height:1.15;text-wrap:balance;}
  p{margin:0;color:var(--muted);font-size:1.05rem;max-width:34ch;font-weight:300;}
  .ig{display:inline-flex;align-items:center;gap:.6rem;margin-top:1rem;
    background:var(--bright);color:var(--ink);border-radius:999px;
    padding:.95rem 1.8rem;font-weight:700;font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;
    transition:transform .3s ease,opacity .3s ease;}
  .ig:hover{opacity:.9;transform:translateY(-1px);}
  .ig svg{width:1.15rem;height:1.15rem;}
  .back{margin-top:.4rem;font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);
    text-decoration:none;transition:color .25s ease;font-weight:700;}
  .back:hover{color:var(--bright);}
  a{color:inherit;text-decoration:none;}
  @keyframes rise{to{opacity:1;transform:translateY(0);}}
  @media (prefers-reduced-motion:reduce){ .wrap{opacity:1;transform:none;animation:none;} }
</style>
</head>
<body>
  <div class="glow"></div>
  <main class="wrap">
    <img class="logo" src="logo-white.svg" alt="La Rimessa">
    <span class="eyebrow">Request received</span>
    <h1>You're on the waiting list.</h1>
    <p>Thank you. We'll be in touch soon with news.</p>
    <a class="ig" href="https://www.instagram.com/larimessa.meina/" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg>
      Follow us on Instagram
    </a>
    <a class="back" href="index.html">← Back to La Rimessa</a>
  </main>
</body>
</html>
